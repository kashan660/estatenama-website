<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Blog - EstateNama Admin</title>
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <!-- Admin Header -->
    <header class="admin-header">
        <nav class="admin-nav">
            <a href="admin-dashboard.html" class="admin-logo">
                <i class="fas fa-building"></i>
                <h1>Estate<span>Nama</span></h1>
            </a>
            
            <div class="admin-user">
                <div class="user-info">
                    <div class="user-avatar">A</div>
                    <span id="currentUser">Admin</span>
                </div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </nav>
    </header>

    <div class="admin-container">
        <!-- Back to Dashboard -->
        <div class="back-nav">
            <a href="admin-dashboard.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="page-header">
                <h1 class="page-title">Add New Blog</h1>
                <p class="page-subtitle">Create a new blog article for your website</p>
            </div>

            <div class="admin-content">
                <form id="blogForm" class="content-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="blogTitle">Blog Title *</label>
                            <input type="text" id="blogTitle" name="title" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="blogSlug">URL Slug *</label>
                            <input type="text" id="blogSlug" name="slug" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="blogAuthor">Author</label>
                        <input type="text" id="blogAuthor" name="author" value="Admin">
                    </div>

                    <div class="form-group">
                        <label for="blogExcerpt">Excerpt</label>
                        <textarea id="blogExcerpt" name="excerpt" rows="3" placeholder="Brief description of the blog article..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="blogContent">Content *</label>
                        <textarea id="blogContent" name="content" rows="12" required placeholder="Write your blog content here..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="blogCategory">Category</label>
                            <select id="blogCategory" name="category">
                                <option value="">Select Category</option>
                                <option value="real-estate">Real Estate</option>
                                <option value="investment">Investment</option>
                                <option value="market-trends">Market Trends</option>
                                <option value="property-tips">Property Tips</option>
                                <option value="success-stories">Success Stories</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="blogStatus">Status</label>
                            <select id="blogStatus" name="status">
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="blogTags">Tags</label>
                        <input type="text" id="blogTags" name="tags" placeholder="comma, separated, tags">
                    </div>

                    <div class="form-group">
                        <label for="blogFeaturedImage">Featured Image</label>
                        <input type="file" id="blogFeaturedImage" name="featuredImage" accept="image/*">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='admin-dashboard.html'">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            Publish Blog
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/admin-auth.js?v=20260121"></script>
    <script>
        // Check authentication
        const auth = new AdminAuth();
        if (!auth.isLoggedIn()) {
            window.location.href = 'admin-login.html';
        }

        // Set current user
        document.getElementById('currentUser').textContent = auth.getUsername();

        // Auto-generate slug from title
        document.getElementById('blogTitle').addEventListener('input', function() {
            const title = this.value.trim();
            const slug = title.toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            document.getElementById('blogSlug').value = slug;
        });

        // Form submission
        document.getElementById('blogForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/api/admin/blogs', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${auth.getToken()}`
                    },
                    body: formData
                });

                if (response.ok) {
                    alert('Blog created successfully!');
                    window.location.href = 'admin-dashboard.html';
                } else {
                    throw new Error('Failed to create blog');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error creating blog. Please try again.');
            }
        });

        function logout() {
            auth.logout();
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
